<!DOCTYPE html>
<html lang="en">
    {{ partial "head.html" . }}
<body>
    {{ with .Site.Params.banner }}
    <div class="bg-banner" style="background-image: url('{{ . | relURL }}');"></div>
    {{ end }}

    <!-- Background Animation -->
    <div class="bg-animation" id="bgAnimation"></div>

    <div class="container mx-auto px-4 py-12 max-w-md relative z-10">
        <!-- Profile Section -->
        {{ partial "profile.html" . }}

        <!-- Registration Section -->
        {{ partial "registration.html" . }}

        {{ partial "video.html" . }}

        <!-- Links Section -->
        {{ partial "link-card.html" . }}

        <footer class="text-center text-xs opacity-60">
            © 2026 Cactus Dog
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
